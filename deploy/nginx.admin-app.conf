server {
    listen 80;
    server_name www.chime.pink;

    root /var/www/chime-admin-app;
    index index.html;

    location = / {
        return 301 /admin-app/;
    }

    location = /admin-app {
        return 301 /admin-app/;
    }

    location /admin-app/ {
        alias /var/www/chime-admin-app/;
        index index.html;
        try_files $uri $uri/ /admin-app/index.html;
    }

    location / {
        return 404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /upload/ {
        proxy_pass http://127.0.0.1:8001/upload/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /socket/ {
        proxy_pass http://127.0.0.1:8001/socket/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
