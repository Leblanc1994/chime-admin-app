# Live server configuration as of 2026-10-21. Requires the existing Let's Encrypt certificate.
server {
    listen 80 default_server;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/www.chime.pink/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.chime.pink/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ChimeSSL:10m;
    ssl_session_timeout 1d;
    server_name 47.103.193.22 chime.pink www.chime.pink;
    client_max_body_size 100m;

    root /var/www/chime-admin;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /app {
        return 301 /app/;
    }

    location /app/ {
        alias /var/www/chime-admin-app/;
        index index.html;
        try_files $uri $uri/ /app/index.html;
    }

    location = /admin-app {
        return 301 /admin-app/;
    }

    location /admin-app/ {
        alias /var/www/chime-admin-app/;
        index index.html;
        try_files $uri $uri/ /admin-app/index.html;
    }

    location = / {
        return 302 /admin-web/;
    }

    location /admin-web/ {
        try_files $uri $uri/ /admin-web/index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /upload/ {
        proxy_pass http://127.0.0.1:8001/upload/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket/ {
        proxy_pass http://127.0.0.1:8001/socket/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
